name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ./build/ember lex programs/hello.asm
      - run: ./build/ember programs/hello.asm
      - run: ./build/ember programs/search.asm
      - run: ./build/ember programs/fib.asm
      - run: ./build/ember lex bad.asm || true